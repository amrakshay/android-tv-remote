name: Release

# Pushing a v* tag builds the app and publishes it on a GitHub release. The tag
# is checked against the VERSION file first, so a mistyped tag fails loudly
# instead of shipping an APK labelled with the wrong number.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG VERSION=$FILE"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($FILE)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      - name: Unit tests
        run: ./gradlew :protocol:test --console=plain

      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ATVREMOTE_KEYSTORE_BASE64 }}
        run: |
          # Without the secret the build would quietly produce an unsigned APK,
          # which is worse than failing, so check before building rather than
          # discovering it from a user whose upgrade was refused.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ATVREMOTE_KEYSTORE_BASE64 is not set; refusing to publish an unsigned APK"
            exit 1
          fi
          mkdir -p "$HOME/.android-tv-remote"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android-tv-remote/release.keystore"
          chmod 600 "$HOME/.android-tv-remote/release.keystore"
          # Pass the path through the environment file rather than a workflow
          # expression: the env context does not carry system variables, so an
          # expression naming HOME expands to nothing and Gradle silently builds
          # unsigned instead of failing.
          echo "ATVREMOTE_KEYSTORE=$HOME/.android-tv-remote/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          ATVREMOTE_KEYSTORE_PASSWORD: ${{ secrets.ATVREMOTE_KEYSTORE_PASSWORD }}
          ATVREMOTE_KEY_PASSWORD: ${{ secrets.ATVREMOTE_KEY_PASSWORD }}
          ATVREMOTE_KEY_ALIAS: atvremote
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Check the APK is signed with the release key
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          echo "apksigner: ${APKSIGNER:-NOT FOUND}"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          if [ ! -f "$APK" ]; then
            # Gradle names the output app-release-unsigned.apk when it had no
            # keystore, so a missing file here means signing did not happen
            # rather than the build failing.
            echo "::error::$APK is missing; the build produced an unsigned APK, so the key was not picked up"
            ls -la "$(dirname "$APK")" || true
            exit 1
          fi
          # Match on the certificate DN, not on "Signer #1": build-tools 37
          # labels the lines "V2 Signer:" instead, and a grep for the old label
          # passes nothing and fails a correctly signed build.
          if ! out=$("$APKSIGNER" verify --print-certs "$APK" 2>&1); then
            echo "$out"
            echo "::error::apksigner could not verify $APK"
            exit 1
          fi
          echo "$out"
          if ! echo "$out" | grep -q "CN=android-tv-remote"; then
            echo "::error::$APK is not signed with the project's release key"
            exit 1
          fi

      - name: Name the APK after the release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/android-tv-remote-${GITHUB_REF_NAME}.apk"
          ls -la dist

      - name: Pull this version's notes out of the changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # The section from this version's heading to the next one.
          awk -v v="$TAG" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section for $TAG." > release-notes.md
          fi
          {
            echo ""
            echo "### About this APK"
            echo ""
            echo "Signed with the project's release key, so an installed copy can be upgraded"
            echo "in place. Sideload with:"
            echo ""
            echo '```'
            echo "adb install -r android-tv-remote-${GITHUB_REF_NAME}.apk"
            echo '```'
            echo ""
            echo "Nothing is installed on the TV. Open the app with the TV switched on, and it"
            echo "will find it."
          } >> release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
